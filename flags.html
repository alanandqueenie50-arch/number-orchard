<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fff8ea">
<meta name="description" content="看 32 面國旗，認識中英文國名，玩三選一闖關。">
<title>國旗小旅行｜小小練習島</title>
<style>
:root{color-scheme:light;--ink:#23274b;--paper:#fff8ea;--mint:#b0f2cf;--lilac:#e9e0ff;--yellow:#ffe06f;--blue:#afe4ff;--pink:#ffbfd9}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top right,#d9eaff,transparent 55%),var(--paper);color:var(--ink);font-family:ui-rounded,"PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.45}
main{width:min(100% - 24px,720px);margin:13px auto 26px}
a{color:inherit}h1,h2,p{margin:0}
.back{display:inline-block;padding:9px 0;text-decoration:none;font-weight:850}
.hero,.panel{border:2px solid var(--ink);border-radius:26px;box-shadow:4px 5px 0 var(--ink)}
.hero{display:flex;align-items:center;gap:clamp(13px,4vw,25px);padding:clamp(15px,4vw,24px);margin:3px 0 18px;background:var(--yellow)}
.hero-icon{display:grid;place-items:center;flex:none;width:clamp(53px,15vw,80px);aspect-ratio:1;border:2px solid var(--ink);border-radius:18px;background:var(--mint);font-size:clamp(29px,9vw,48px);transform:rotate(-8deg)}
h1{font-size:clamp(28px,7.8vw,47px);font-weight:950;line-height:1.13}
.hero p{margin-top:5px;font-size:clamp(13px,3.4vw,16px);font-weight:750}
.panel{padding:clamp(11px,4vw,23px);background:#fffdf9}
button,select{min-height:46px;padding:5px 10px;border:2px solid var(--ink);border-radius:14px;background:#fffdfa;color:inherit;font:inherit;font-weight:800}
button{cursor:pointer;touch-action:manipulation}
button:active:not(:disabled){transform:translateY(2px)}
a:focus-visible,button:focus-visible,select:focus-visible,[tabindex="-1"]:focus-visible{outline:3px dashed #5734bd;outline-offset:4px}
.modes,.travel,.answers{display:grid;gap:8px}
.modes,.travel{grid-template-columns:1fr 1fr}
.mode{min-height:52px;font-size:clamp(16px,4.2vw,21px);background:var(--lilac)}
.mode:nth-child(2){background:var(--blue)}
.mode[aria-pressed="true"]{box-shadow:inset 0 0 0 2px white,0 3px 0 var(--ink)}
.mode[aria-pressed="true"]::before{content:"✓ "}
.status{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:15px 0 7px;font-size:14px;font-weight:850}
#score{background:#fff0b4;padding:3px 9px;border-radius:99px}
progress{display:block;width:100%;height:9px;accent-color:#6844c7}
#game,#finish{text-align:center}
h2{margin:11px 0 8px;font-size:clamp(23px,5.5vw,32px);font-weight:950}
.flag-frame{min-height:clamp(150px,46vw,252px);display:grid;place-items:center;padding:10px;border:2px dashed #9580c0;border-radius:19px;background:#f0e9ff}
.flag-frame img{display:block;width:min(100%,410px);max-height:clamp(135px,40vw,229px);object-fit:contain;filter:drop-shadow(1px 4px 0 #342b5128)}
.flag-frame img.square{width:auto;max-width:100%;height:clamp(135px,40vw,229px)}
.names{margin:9px 0;font-weight:900}
.names strong{display:block;font-size:clamp(22px,6vw,34px)}
.names span{font-size:17px}
.pronunciation{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:9px}
.pronunciation button:first-child{background:var(--mint)}
.pronunciation button:last-child{background:var(--blue)}
#voice-status{margin-top:7px;font-size:13px;font-weight:650}
.travel button:first-child{background:var(--blue)}
.travel button:last-child{background:var(--mint)}
#destination{width:100%;margin-top:8px}
.answers{grid-template-columns:repeat(3,minmax(0,1fr));margin-top:11px}
.answers button{min-height:58px;padding-inline:3px;font-size:clamp(15px,4vw,20px);background:var(--yellow);box-shadow:0 3px 0 var(--ink)}
.answers button:nth-child(2){background:var(--blue)}
.answers button:nth-child(3){background:var(--pink)}
.answers button.wrong{background:#eee7ee;color:#57475d}
.answers button.correct{background:var(--mint)}
#feedback{margin-top:9px;font-weight:850}
#feedback:empty{margin-top:0}
#finish{padding-top:16px}
#finish .stamp{font-size:58px}
.primary{width:100%;background:#5635b4;color:white;margin-top:13px;box-shadow:0 3px 0 var(--ink)}
footer{margin:13px 3px 0;font-size:12px;color:#51486a}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<a class="back" href="./learn.html">← 回小小練習島</a>
<header class="hero">
  <span class="hero-icon" aria-hidden="true">🌍</span>
  <div><h1>國旗小旅行</h1><p>看國旗，認識世界各地的名字！</p></div>
</header>
<section class="panel" aria-label="國旗練習">
  <div class="modes" role="group" aria-label="選擇玩法">
    <button type="button" class="mode" id="study-mode" aria-pressed="true">認識國旗</button>
    <button type="button" class="mode" id="quiz-mode" aria-pressed="false">猜是哪一國</button>
  </div>
  <div class="status"><span id="position"></span><span id="score" hidden></span></div>
  <progress id="progress" value="0" max="5" aria-label="闖關進度" hidden></progress>
  <div id="game">
    <h2 id="prompt" tabindex="-1" hidden>這是哪一國的國旗？</h2>
    <div class="flag-frame"><img id="flag" alt=""></div>
    <div class="names" id="names">
      <strong id="chinese"></strong><span id="english" lang="en"></span>
      <div class="pronunciation" role="group" aria-label="聽國名">
        <button type="button" id="speak-zh">🔊 念中文</button>
        <button type="button" id="speak-en">🔊 念英文</button>
      </div>
      <p id="voice-status" role="status" hidden></p>
    </div>
    <div id="study-controls">
      <div class="travel">
        <button type="button" id="previous">← 上一面</button>
        <button type="button" id="next">下一面 →</button>
      </div>
      <select id="destination" aria-label="選一面國旗"></select>
    </div>
    <div class="answers" id="answers" role="group" aria-label="選擇國家" hidden></div>
    <p id="feedback" role="status"></p>
    <button class="primary" type="button" id="continue" hidden>下一題 →</button>
  </div>
  <div id="finish" hidden>
    <span class="stamp" aria-hidden="true">🏅</span>
    <h2 id="finish-title" tabindex="-1">旅行完成！</h2>
    <p>你已收集 5 枚旅行印章。</p>
    <button type="button" class="primary" id="restart">再玩一次</button>
  </div>
  <audio id="country-voice" preload="none" hidden></audio>
  <noscript>請開啟 JavaScript 開始玩。</noscript>
</section>
<footer>旗幟圖片來源 <a href="https://flagpedia.net/download">Flagpedia</a> · 國名為<a href="https://www.openslr.org/93">合成語音</a></footer>
</main>

const ui = Object.fromEntries([
  "study-mode", "quiz-mode", "position", "score", "progress", "game", "prompt", "flag", "names",
  "chinese", "english", "study-controls", "previous", "next", "destination", "answers", "feedback",
  "finish", "finish-title", "restart", "speak-zh", "speak-en", "voice-status", "continue", "country-voice"
].map(id => [id, document.getElementById(id)]));

const roundSize = 5;
let mode = "study";
let destination = 0;
let questions = [];
let index = 0;
let answered = false;
let nextTimer;
let speechRequest = 0;
let currentFlag;

function shuffled(items) {
  const list = [...items];
  for (let i = list.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [list[i], list[j]] = [list[j], list[i]];
  }
  return list;
}

function stopSpeech() {
  speechRequest++;
  ui["country-voice"].pause();
  ui["voice-status"].hidden = true;
}

function speakName(language) {
  if (ui.names.hidden || ui.game.hidden) return;
  stopSpeech();
  if (mode === "quiz") {
    clearTimeout(nextTimer);
    ui.continue.hidden = false;
    ui.continue.textContent = index + 1 < roundSize ? "下一題 →" : "看結果 →";
  }

  const request = speechRequest;
  function showUnavailable() {
    if (request !== speechRequest) return;
    ui["voice-status"].textContent = "這個裝置目前無法念出國名。";
    ui["voice-status"].hidden = false;
  }
  const source = recordings[currentFlag.code]?.[language];
  if (!source) {
    showUnavailable();
    return;
  }
  const audio = ui["country-voice"];
  audio.src = source;
  audio.play().catch(showUnavailable);
}

function showFlag(item) {
  stopSpeech();
  currentFlag = item;
  ui.flag.src = item.image;
  ui.flag.alt = mode === "study" ? item.chinese + "的旗幟" : "請辨認這面國旗";
  ui.flag.className = item.code === "ch" ? "square" : "";
  ui.chinese.textContent = item.chinese;
  ui.english.textContent = item.english;
}

function browse() {
  const item = collection[destination];
  showFlag(item);
  ui.position.textContent = "第 " + (destination + 1) + " / " + collection.length + " 面";
  ui.destination.value = String(destination);
}

function updateScore(score) {
  ui.score.textContent = "⭐ " + score + " / " + roundSize;
  ui.progress.value = score;
}

function showQuestion(focus = false) {
  const question = questions[index];
  answered = false;
  ui.names.hidden = true;
  ui.continue.hidden = true;
  ui.position.textContent = "第 " + (index + 1) + " / " + roundSize + " 題";

  ui.answers.replaceChildren();
  const others = shuffled(collection.filter(item => item !== question)).slice(0, 2);
  for (const item of shuffled([question, ...others])) {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = item.chinese;
    button.addEventListener("click", () => answer(button, item === question));
    ui.answers.append(button);
  }
  if (focus) ui.prompt.focus();
}

function answer(button, correct) {
  if (answered || button.disabled) return;
  if (!correct) {
    button.classList.add("wrong");
    button.disabled = true;
    ui.feedback.textContent = "再看看顏色和圖案，試一次！";
    [...ui.answers.children].find(choice => !choice.disabled).focus();
    return;
  }
  answered = true;
  for (const choice of ui.answers.children) choice.disabled = true;
  button.classList.add("correct");
  ui.names.hidden = false;
  ui.flag.alt = questions[index].chinese + "的旗幟";
  ui.feedback.textContent = "答對了！拿到一枚旅行印章 ⭐";
  updateScore(index + 1);
  nextTimer = setTimeout(advanceQuestion, 2100);
}

function advanceQuestion() {
  clearTimeout(nextTimer);
  stopSpeech();
  index++;
  if (index < roundSize) {
    showQuestion(true);
    return;
  }
  ui.game.hidden = true;
  ui.finish.hidden = false;
  ui["finish-title"].focus();
}

function changeMode(nextMode, focus = true) {
  clearTimeout(nextTimer);
  mode = nextMode;
  const study = mode === "study";
  ui["study-mode"].setAttribute("aria-pressed", String(study));
  ui["quiz-mode"].setAttribute("aria-pressed", String(!study));
  ui["study-controls"].hidden = !study;
  ui.answers.hidden = study;
  ui.continue.hidden = true;
  ui.prompt.hidden = study;
  ui.names.hidden = !study;
  ui.progress.hidden = study;
  ui.score.hidden = study;
  ui.game.hidden = false;
  ui.finish.hidden = true;
  ui.feedback.textContent = "";
  if (study) {
    browse();
    return;
  }
  questions = shuffled(collection).slice(0, roundSize);
  index = 0;
  updateScore(0);
  showQuestion(focus);
}

for (const [index, item] of collection.entries()) {
  const option = document.createElement("option");
  option.value = String(index);
  option.textContent = item.chinese + " · " + item.english;
  ui.destination.append(option);
}
ui.destination.addEventListener("change", () => {
  destination = Number(ui.destination.value);
  browse();
});
ui.previous.addEventListener("click", () => {
  destination = (destination + collection.length - 1) % collection.length;
  browse();
});
ui.next.addEventListener("click", () => {
  destination = (destination + 1) % collection.length;
  browse();
});
ui["study-mode"].addEventListener("click", () => {
  if (mode !== "study") changeMode("study");
});
ui["quiz-mode"].addEventListener("click", () => {
  if (mode !== "quiz") changeMode("quiz");
});
ui["speak-zh"].addEventListener("click", () => speakName("zh"));
ui["speak-en"].addEventListener("click", () => speakName("en"));
ui.continue.addEventListener("click", advanceQuestion);
ui.restart.addEventListener("click", () => changeMode("quiz"));
changeMode("study", false);
</script>
</body>
</html>
