<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffe06a">
<title>數數小果園</title>
<style>
:root {
  color-scheme: light;
  --ink: #251546;
  --paper: #fff8e9;
  --purple: #6d3bd3;
  --pink: #ff86bc;
  --yellow: #ffe06a;
  --mint: #aef2bf;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  color: var(--ink);
  font-family: ui-rounded, system-ui, "PingFang TC", "Microsoft JhengHei", sans-serif;
  background:
    radial-gradient(circle at 13% 12%, #ffd5ea 0, transparent 32%),
    radial-gradient(circle at 95% 68%, #d0c7ff 0, transparent 42%),
    var(--paper);
  min-height: 100vh;
}
main { width: min(100% - 28px, 630px); margin: 26px auto 36px; }
h1, h2, p { margin: 0; }
.hero {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  border: 2px solid var(--ink);
  border-radius: 29px;
  padding: 16px clamp(13px, 4vw, 25px);
  background: var(--yellow);
  box-shadow: 4px 5px 0 var(--ink);
  margin-bottom: 17px;
}
.hero-title { display: flex; align-items: center; gap: clamp(7px, 3vw, 16px); }
.mascot {
  display: grid;
  place-items: center;
  width: clamp(44px, 11vw, 62px);
  aspect-ratio: 1;
  background: #ff9dcb;
  border: 2px solid var(--ink);
  border-radius: 19px;
  font-size: clamp(25px, 6vw, 37px);
  transform: rotate(-8deg);
}
h1 { font-size: clamp(23px, 5.5vw, 36px); font-weight: 900; line-height: 1.13; }
.hero p { margin-top: 4px; font-size: clamp(12px, 2.9vw, 15px); font-weight: 650; }
.card {
  position: relative;
  padding: clamp(13px, 4vw, 24px);
  border: 2px solid var(--ink);
  border-radius: 29px;
  background: #fffdf9;
  box-shadow: 4px 5px 0 var(--ink);
}
.controls, .status {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
}
.modes { display: flex; gap: 5px; }
button, select {
  font: inherit;
  color: inherit;
  min-height: 44px;
  border: 2px solid var(--ink);
  border-radius: 13px;
  background: #fff;
  padding: 5px 10px;
  font-weight: 800;
}
button { cursor: pointer; touch-action: manipulation; }
button:not(:disabled):active { transform: translateY(2px); }
button:focus-visible, select:focus-visible, [tabindex="-1"]:focus-visible {
  outline: 3px dashed var(--purple);
  outline-offset: 4px;
}
button[aria-pressed="true"], .primary { background: var(--purple); color: #fff; }
.voice { background: #fff; flex: none; font-size: 14px; }
.voice[aria-pressed="true"] { background: var(--mint); color: var(--ink); }
.status { margin: 15px 0 6px; font-weight: 800; font-size: 15px; }
#stars { padding: 3px 9px; border-radius: 999px; background: #fff0ad; }
progress { display: block; width: 100%; height: 10px; accent-color: var(--purple); }
progress::-webkit-progress-bar { background: #ede2ff; border-radius: 20px; }
progress::-webkit-progress-value { background: #8153ef; border-radius: 20px; }
progress::-moz-progress-bar { background: #8153ef; border-radius: 20px; }
.play, .result { text-align: center; margin-top: 13px; }
.prompt {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(6px, 3vw, 17px);
}
h2 { font-size: clamp(37px, 10vw, 59px); font-weight: 950; line-height: 1.13; }
#hear { background: #e4d5ff; font-size: 14px; padding-inline: 8px; }
.fruit-board {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(5px, 2vw, 12px);
  min-height: 100px;
  margin: 10px 0;
  border: 2px dashed #9270d4;
  border-radius: 20px;
  padding: 8px;
  background: #f2e9ff;
  font-weight: 850;
}
.fruit-group {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 4px;
  max-width: min(100%, 9.1em);
  font-size: clamp(26px, 6.6vw, 43px);
  line-height: 1.16;
}
.fruit-group.add { max-width: min(45%, 5.65em); }
.fruit { display: inline-block; text-align: center; width: 1.08em; }
.fruit-box {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 3px;
  align-self: center;
  padding: 3px 5px;
  border: 2px solid #b180d5;
  border-radius: 10px;
  background: #fffdf9;
  font-size: .67em;
}
.fruit-box small { font-size: .6em; white-space: nowrap; }
.fruit-box .remaining {
  color: #642052;
  background: #ffd2e7;
  border-radius: 4px;
  padding: 1px 3px;
}
.fruit-box.removed { width: auto; }
.visual-hint { margin: -3px 0 8px; font-size: 13px; font-weight: 700; }
.fruit { position: relative; }
.removed { opacity: .55; }
.removed::after {
  content: "";
  position: absolute;
  inset: 48% 0 auto;
  height: 3px;
  background: #75244a;
  transform: rotate(-42deg);
}
#instruction { font-size: 15px; font-weight: 750; }
.options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin-top: 8px; }
.options button {
  min-height: 60px;
  font-size: 31px;
  background: var(--pink);
  box-shadow: 0 4px 0 var(--ink);
}
.options button:nth-child(2) { background: #8be4ff; }
.options button:nth-child(3) { background: #ffdc64; }
.options button.wrong { background: #f2e9f2; color: #654a67; box-shadow: none; }
.options button.right { background: #a0f6b2; animation: bounce .42s ease-out; }
.feedback { min-height: 1.45em; margin: 12px 0 6px; font-size: 15px; font-weight: 800; }
.primary { width: 100%; min-height: 48px; font-size: 17px; box-shadow: 0 3px 0 var(--ink); }
.voice-status { margin-top: 7px; font-size: 13px; text-align: center; }
.result { padding: 14px 0 0; }
.result-icon { font-size: 54px; display: block; margin-bottom: 8px; }
.result p { margin: 10px 0 16px; font-weight: 750; }
.confetti { position: absolute; inset: 0; overflow: hidden; pointer-events: none; border-radius: inherit; }
.confetti i {
  position: absolute;
  top: 70%;
  left: 50%;
  width: 9px;
  height: 13px;
  border-radius: 3px;
  background: var(--color);
  opacity: 0;
  animation: toss .72s ease-out forwards;
}
@keyframes toss {
  15% { opacity: 1; }
  100% { transform: translate(var(--x), var(--y)) rotate(var(--spin)); opacity: 0; }
}
@keyframes bounce {
  35% { transform: translateY(-7px) scale(1.07); }
  100% { transform: none; }
}
@media (max-width: 370px) {
  main { width: calc(100% - 20px); margin-top: 14px; }
  .hero { padding: 13px 9px; }
  .voice { padding-inline: 6px; font-size: 13px; }
  .controls button, .controls select { padding-inline: 7px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0s !important; }
}
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header class="hero">
    <div class="hero-title">
      <span class="mascot" aria-hidden="true">🍓</span>
      <div><h1>數數小果園</h1><p>數水果，收集星星！</p></div>
    </div>
    <button type="button" id="voice" class="voice" aria-label="語音" aria-pressed="false">🔇 語音</button>
  </header>
  <section class="card" aria-label="加減法練習">
    <div class="controls">
      <div class="modes" role="group" aria-label="題型">
        <button type="button" data-mode="mixed" aria-pressed="true">混合</button>
        <button type="button" data-mode="add" aria-pressed="false">加法</button>
        <button type="button" data-mode="subtract" aria-pressed="false">減法</button>
      </div>
      <select id="limit" aria-label="遊戲難度">
        <option value="10" selected>Easy · 10 以內</option>
        <option value="20">Medium · 20 以內</option>
        <option value="100">Hard · 100 以內</option>
      </select>
    </div>
    <div class="status"><span id="round"></span><span id="stars"></span></div>
    <progress id="progress" max="10" value="0" aria-label="答題進度"></progress>
    <div class="play" id="play">
      <div class="prompt">
        <h2 id="equation" tabindex="-1"></h2>
        <button type="button" id="hear">🔊 念題</button>
      </div>
      <div class="fruit-board" id="fruit-board" role="img"></div>
      <p id="visual-hint" class="visual-hint" hidden>每盒有 10 顆水果</p>
      <p id="instruction">選一個答案</p>
      <div class="options" id="options" role="group" aria-labelledby="instruction"></div>
      <p id="feedback" class="feedback" role="status"></p>
      <button type="button" id="next" class="primary" hidden>下一題</button>
    </div>
    <div class="result" id="result" hidden>
      <span class="result-icon" aria-hidden="true">🏆</span>
      <h2 id="result-title" tabindex="-1">闖關完成！</h2>
      <p id="summary"></p>
      <button type="button" id="restart" class="primary">再玩一次</button>
    </div>
    <div id="confetti" class="confetti" aria-hidden="true"></div>
    <p id="voice-status" class="voice-status" role="status" hidden></p>
    <noscript>請開啟 JavaScript，才能開始遊戲。</noscript>
  </section>
</main>
<script>
"use strict";

const roundSize = 10;
const ui = Object.fromEntries(
  ["limit", "round", "stars", "progress", "play", "equation", "fruit-board",
    "options", "feedback", "next", "result", "result-title", "summary", "restart",
    "voice", "hear", "confetti", "voice-status", "visual-hint"]
    .map(id => [id, document.getElementById(id)])
);
const modeButtons = document.querySelectorAll("[data-mode]");
let mode = "mixed";
let questions = [];
let index = 0;
let score = 0;
let answered = false;
let voiceEnabled = false;
const speech = window.speechSynthesis;
const fruitTypes = [
  {symbol: "🍎", name: "蘋果"},
  {symbol: "🍓", name: "草莓"},
  {symbol: "🍊", name: "橘子"},
  {symbol: "🍒", name: "櫻桃"},
  {symbol: "🍐", name: "梨子"}
];
const cheers = [
  "答對了！得到一顆星！",
  "好棒喔！又多一顆星！",
  "你數對了！送你一顆星！"
];

function taiwanVoice() {
  const voices = speech.getVoices().filter(voice => /^zh[-_]tw$/i.test(voice.lang));
  const femaleNames = /meijia|mei.?jia|hsiao.?chen|hsiao.?yu|yating|google.*台灣|美佳|曉臻|曉辰|曉雨|雅婷|hanhan|涵涵|ting.?ting/i;
  return voices.find(voice => femaleNames.test(voice.name)) ||
    voices.find(voice => /female|女聲/i.test(voice.name)) ||
    voices[0];
}

function voiceUnavailable() {
  ui["voice-status"].textContent = "這台裝置目前無法播放語音。";
  ui["voice-status"].hidden = false;
}

function speak(text) {
  if (!voiceEnabled) return;
  if (!speech || !window.SpeechSynthesisUtterance) {
    voiceUnavailable();
    return;
  }
  ui["voice-status"].hidden = true;
  speech.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  const voice = taiwanVoice();
  utterance.lang = "zh-TW";
  if (voice) utterance.voice = voice;
  utterance.rate = 0.84;
  utterance.pitch = 1.08;
  utterance.onerror = event => {
    if (!["canceled", "interrupted"].includes(event.error)) voiceUnavailable();
  };
  speech.speak(utterance);
}

function setVoice(enabled) {
  voiceEnabled = enabled;
  ui.voice.setAttribute("aria-pressed", String(enabled));
  ui.voice.textContent = enabled ? "🔊 語音" : "🔇 語音";
  if (!enabled) {
    ui["voice-status"].hidden = true;
    speech?.cancel();
  }
}

function readQuestion() {
  const {a, b, sign} = questions[index];
  const operation = sign === "+" ? "加" : "減";
  speak(a + " " + operation + " " + b + "，等於多少？");
}

function celebrate() {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const colors = ["#fc66a4", "#25bfed", "#ffd940", "#a06bff", "#55d781"];
  const pieces = Array.from({length: 16}, (_, i) => {
    const piece = document.createElement("i");
    piece.style.setProperty("--color", colors[i % colors.length]);
    piece.style.setProperty("--x", ((i - 7.5) * 23) + "px");
    piece.style.setProperty("--y", (-70 - Math.random() * 175) + "px");
    piece.style.setProperty("--spin", (i * 50) + "deg");
    return piece;
  });
  ui.confetti.replaceChildren(...pieces);
}

function shuffle(items) {
  for (let i = items.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [items[i], items[j]] = [items[j], items[i]];
  }
  return items;
}

function newRound(focus = false) {
  const limit = Number(ui.limit.value);
  const additions = [];
  const subtractions = [];
  for (let a = 0; a <= limit; a++) {
    for (let b = 0; b <= limit; b++) {
      if (a + b <= limit) additions.push({a, b, sign: "+", answer: a + b});
      if (b <= a) subtractions.push({a, b, sign: "−", answer: a - b});
    }
  }
  shuffle(additions);
  shuffle(subtractions);
  if (mode === "mixed") {
    questions = shuffle([...additions.slice(0, 5), ...subtractions.slice(0, 5)]);
  } else {
    questions = (mode === "add" ? additions : subtractions).slice(0, roundSize);
  }
  index = 0;
  score = 0;
  ui.play.hidden = false;
  ui.result.hidden = true;
  showQuestion(focus);
  readQuestion();
}

function fruitGroup(fruitType, count, removed, grouped, isAdd = false) {
  const group = document.createElement("span");
  group.className = isAdd ? "fruit-group add" : "fruit-group";
  if (count === 0) {
    group.textContent = "0";
    return group;
  }

  const kept = count - removed;
  const boxes = grouped ? Math.floor(count / 10) : 0;
  for (let i = 0; i < boxes; i++) {
    const box = document.createElement("span");
    box.className = "fruit-box";
    box.textContent = fruitType.symbol;
    const label = document.createElement("small");
    const keptInBox = Math.max(0, Math.min(10, kept - i * 10));
    if (keptInBox === 0) box.classList.add("removed");
    if (keptInBox > 0 && keptInBox < 10) {
      label.className = "remaining";
      label.textContent = "剩 " + keptInBox;
    } else {
      label.textContent = "×10";
    }
    box.append(label);
    group.append(box);
  }

  for (let i = boxes * 10; i < count; i++) {
    const fruit = document.createElement("span");
    fruit.className = i >= kept ? "fruit removed" : "fruit";
    fruit.textContent = fruitType.symbol;
    group.append(fruit);
  }
  return group;
}

function showQuestion(focus) {
  const {a, b, sign, answer} = questions[index];
  const add = sign === "+";
  const fruit = fruitTypes[index % fruitTypes.length];
  const limit = Number(ui.limit.value);
  const grouped = limit === 100;
  ui["visual-hint"].hidden = !grouped;
  answered = false;
  ui.confetti.replaceChildren();
  ui.round.textContent = "第 " + (index + 1) + " / " + roundSize + " 題";
  ui.stars.textContent = "⭐ " + score + " 顆星";
  ui.progress.value = index;
  ui.equation.textContent = a + " " + sign + " " + b + " = ?";
  ui["fruit-board"].replaceChildren();
  if (add) {
    const plus = document.createElement("span");
    plus.textContent = "+";
    ui["fruit-board"].append(fruitGroup(fruit, a, 0, grouped, true), plus, fruitGroup(fruit, b, 0, grouped, true));
    ui["fruit-board"].setAttribute("aria-label", a + " 顆" + fruit.name + "，再加 " + b + " 顆");
  } else {
    ui["fruit-board"].append(fruitGroup(fruit, a, b, grouped));
    ui["fruit-board"].setAttribute("aria-label", a + " 顆" + fruit.name + "，劃掉 " + b + " 顆");
  }
  ui.options.replaceChildren();
  ui.feedback.textContent = "";
  ui.next.hidden = true;
  ui.next.textContent = index === roundSize - 1 ? "看結果" : "下一題";
  const candidates = [-10, -5, -3, -2, -1, 1, 2, 3, 5, 10]
    .map(offset => answer + offset)
    .filter(choice => choice >= 0 && choice <= limit);
  const choices = shuffle([answer, ...shuffle(candidates).slice(0, 2)]);
  for (const choice of choices) {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = choice;
    button.addEventListener("click", () => checkAnswer(button, choice === answer));
    ui.options.append(button);
  }
  if (focus) ui.equation.focus();
}

function checkAnswer(button, correct) {
  if (answered) return;
  if (!correct) {
    button.classList.add("wrong");
    button.disabled = true;
    ui.feedback.textContent = "再數一次水果，試試看！";
    speak("別急，再數一次水果，試試看！");
    ui.options.querySelector("button:not(:disabled)").focus();
    return;
  }
  answered = true;
  score++;
  button.classList.add("right");
  for (const option of ui.options.children) option.disabled = true;
  ui.stars.textContent = "⭐ " + score + " 顆星";
  ui.progress.value = score;
  const cheer = cheers[(score - 1) % cheers.length];
  ui.feedback.textContent = cheer + " ⭐";
  celebrate();
  speak(cheer);
  ui.next.hidden = false;
  ui.next.focus();
}

ui.next.addEventListener("click", () => {
  index++;
  if (index < roundSize) {
    showQuestion(true);
    readQuestion();
    return;
  }
  ui.play.hidden = true;
  ui.result.hidden = false;
  ui.summary.textContent = "你完成了 " + roundSize + " 題，收集到 " + score + " 顆星！";
  ui["result-title"].focus();
  celebrate();
  speak("闖關完成！你收集到十顆星，太棒了！");
});

ui.voice.addEventListener("click", () => {
  setVoice(!voiceEnabled);
  if (ui.result.hidden && !answered) readQuestion();
  else if (voiceEnabled) speak(ui.result.hidden ? "答對了！" : "闖關完成！");
});
ui.hear.addEventListener("click", () => {
  setVoice(true);
  readQuestion();
});

for (const button of modeButtons) {
  button.addEventListener("click", () => {
    if (button.dataset.mode === mode) return;
    mode = button.dataset.mode;
    for (const item of modeButtons) {
      item.setAttribute("aria-pressed", String(item === button));
    }
    newRound();
  });
}
ui.limit.addEventListener("change", () => newRound());
ui.restart.addEventListener("click", () => newRound(true));
newRound();
</script>
</body>
</html>
