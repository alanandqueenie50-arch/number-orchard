<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fffaf1">
<meta name="description" content="小小練習島，孩子在家也能玩的練習遊戲。從數數小果園開始，練習加減法。">
<title>小小練習島</title>
<style>
:root {
  color-scheme: light;
  --ink: #242246;
  --paper: #fffaf1;
  --yellow: #ffe36a;
  --lilac: #ede4ff;
  --purple: #6634c6;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  color: var(--ink);
  background: var(--paper);
  font-family: ui-rounded, "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  line-height: 1.55;
}
.shell { width: min(100% - 32px, 1040px); margin-inline: auto; }
.topbar {
  min-height: 74px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 14px;
}
.brand { font-weight: 900; font-size: clamp(17px, 3.8vw, 21px); }
.brand span { margin-right: 5px; }
a { color: inherit; }
.topbar a {
  font-size: 14px;
  font-weight: 850;
  text-decoration: none;
  border: 2px solid var(--ink);
  border-radius: 999px;
  padding: 7px 13px;
  background: #fffdf8;
}
a:focus-visible { outline: 3px solid #7543d1; outline-offset: 5px; }
.hero {
  display: grid;
  grid-template-columns: 1.16fr 1fr;
  align-items: center;
  min-height: 335px;
  padding: clamp(23px, 5vw, 53px);
  gap: 15px;
  border: 2px solid var(--ink);
  border-radius: 30px;
  background: var(--yellow);
  box-shadow: 5px 6px 0 var(--ink);
  overflow: hidden;
}
h1, h2, h3, p { margin: 0; }
h1 { font-size: clamp(42px, 8.4vw, 79px); font-weight: 950; letter-spacing: -.06em; line-height: 1.04; }
.hero p { font-size: clamp(15px, 2.7vw, 20px); margin-top: 15px; font-weight: 750; }
.hero-art {
  position: relative;
  isolation: isolate;
  min-height: 224px;
  border-radius: 65% 48% 53% 54%;
  background: #ffd1e8;
  border: 2px solid var(--ink);
  box-shadow: 4px 5px 0 var(--ink);
}
.tile {
  display: grid;
  place-items: center;
  position: absolute;
  width: clamp(56px, 11vw, 105px);
  aspect-ratio: 1;
  border: 2px solid var(--ink);
  border-radius: 21px;
  box-shadow: 3px 4px 0 var(--ink);
  font-size: clamp(30px, 5.5vw, 66px);
  font-weight: 950;
  line-height: 1;
}
.tile-one { left: 13%; top: 20%; background: #9ce6fb; transform: rotate(-12deg); }
.tile-plus { left: 39%; top: 9%; background: #bc9bff; transform: rotate(12deg); }
.tile-fruit { left: 56%; top: 42%; background: #aef5bc; transform: rotate(-8deg); }
.spark { position: absolute; font-size: clamp(25px, 4vw, 43px); font-weight: 900; color: var(--purple); }
.spark-left { left: 20%; bottom: 5%; }
.spark-right { right: 7%; top: 6%; }
.collection { margin: 39px auto 45px; scroll-margin-top: 15px; }
.collection h2 { font-size: clamp(25px, 4.5vw, 36px); margin-bottom: 13px; font-weight: 950; }
.games { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap: 18px; }
.game {
  display: grid;
  grid-template-columns: minmax(120px, .8fr) 1.2fr;
  min-height: 213px;
  border: 2px solid var(--ink);
  border-radius: 24px;
  background: #fffdfa;
  box-shadow: 4px 5px 0 var(--ink);
  overflow: hidden;
}
.game-art {
  display: grid;
  place-items: center;
  position: relative;
  background: var(--lilac);
  border-right: 2px solid var(--ink);
  overflow: hidden;
}
.game-art::before {
  content: "";
  position: absolute;
  width: min(76%, 180px);
  aspect-ratio: 1.25;
  border-radius: 50%;
  border: 2px dashed #9f73e3;
  transform: rotate(-14deg);
}
.game-art span { position: relative; font-size: clamp(36px, 8vw, 76px); white-space: nowrap; letter-spacing: -.2em; margin-right: .2em; }
.game-info { align-self: center; padding: clamp(13px, 3.7vw, 26px); }
.game-info h3 { font-size: clamp(23px, 4vw, 32px); font-weight: 950; line-height: 1.15; }
.game-info p { margin-top: 8px; font-size: 15px; }
.game-info .levels { margin-top: 4px; font-size: 13px; font-weight: 750; color: #534666; }
.play {
  display: inline-flex;
  align-items: center;
  gap: 13px;
  min-height: 48px;
  margin-top: 13px;
  padding: 5px 17px;
  text-decoration: none;
  color: #fff;
  background: var(--purple);
  border: 2px solid var(--ink);
  border-radius: 14px;
  box-shadow: 0 3px 0 var(--ink);
  font-weight: 850;
}
.play:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
@media (max-width: 600px) {
  .topbar { min-height: 64px; }
  .hero { grid-template-columns: 1fr; min-height: 0; padding-bottom: 20px; gap: 16px; }
  .hero-art { min-height: 145px; width: min(100%, 340px); justify-self: center; }
  .tile-fruit { left: 59%; top: 32%; }
  .collection { margin-top: 28px; }
}
@media (max-width: 400px) {
  .shell { width: calc(100% - 24px); }
  .game { grid-template-columns: minmax(88px, .63fr) 1.37fr; min-height: 184px; }
  .game-info p { font-size: 14px; }
  .game-info .levels { font-size: 12px; }
}
</style>
</head>
<body>
<header class="topbar shell">
  <div class="brand"><span aria-hidden="true">🏝️</span>小小練習島</div>
  <a href="#games">找遊戲</a>
</header>

<main class="shell">
  <section class="hero" aria-labelledby="hero-title">
    <div>
      <h1 id="hero-title">小小練習島</h1>
      <p>挑一個遊戲，玩著學！</p>
    </div>
    <div class="hero-art" aria-hidden="true">
      <span class="tile tile-one">1</span>
      <span class="tile tile-plus">+</span>
      <span class="tile tile-fruit">🍓</span>
      <span class="spark spark-left">✦</span>
      <span class="spark spark-right">✧</span>
    </div>
  </section>

  <section class="collection" id="games" aria-labelledby="games-title">
    <h2 id="games-title">選一個來玩</h2>
    <div class="games">
      <!-- Add future practice games here as more game cards. -->
      <article class="game" aria-labelledby="orchard-title">
        <div class="game-art" aria-hidden="true"><span>🍎🍊</span></div>
        <div class="game-info">
          <h3 id="orchard-title">數數小果園</h3>
          <p>數水果、練習加減法、收集星星。</p>
          <p class="levels">10、20、100 以內｜語音念題</p>
          <a class="play" href="./index.html" aria-label="開始玩數數小果園">開始玩 <span aria-hidden="true">→</span></a>
        </div>
      </article>
    </div>
  </section>
</main>
</body>
</html>
