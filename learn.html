<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fffaf0">
<meta name="description" content="孩子的數學、英文、注音和國旗練習。">
<title>小小練習島</title>
<link rel="stylesheet" href="./island-practice.css">
<script src="./island-practice.js" defer></script>
</head>
<body>
<header class="nav wrap"><a class="brand" href="./learn.html"><span aria-hidden="true">🏝️</span> 小小練習島</a><a href="#games">遊戲區 ↓</a></header>
<main class="wrap" data-view="home">
  <section class="landing" aria-labelledby="title">
    <div><h1 id="title">小小練習島</h1><p>每天選一點練，懂了就多走一步。</p><a class="button primary" href="./practice.html?subject=math">開始今日練習 →</a></div>
    <div class="cover-art" aria-hidden="true"><div class="art-math">7+3</div><div class="art-english" lang="en">cat</div><div class="art-pencil">✏️</div></div>
  </section>
  <section class="daily" aria-labelledby="daily-title">
    <div><h2 id="daily-title">今日練習</h2><p id="daily-copy" aria-live="polite">完成數學和英文各一回合。</p></div>
    <progress id="daily-progress" max="2" value="0" aria-label="今日科目完成數"></progress>
  </section>
  <section aria-labelledby="routes-title">
    <h2 id="routes-title">選一條學習路線</h2>
    <div class="routes">
      <a class="route math" href="./practice.html?subject=math"><span class="stamp" aria-hidden="true">＋</span><strong>數學練習本</strong><span>數字順序 · 合十 · 加減法</span><span class="route-action">選單元 →</span></a>
      <a class="route literacy" href="./practice.html?subject=english"><span class="stamp" aria-hidden="true" lang="en">Aa</span><strong>英文練習本</strong><span>拼讀 · 常見字 · 聽寫 · 短句</span><span class="route-action">選單元 →</span></a>
    </div>
  </section>
  <section id="games" class="separate" aria-labelledby="games-title">
    <h2 id="games-title">遊戲區</h2>
    <div class="games">
      <a class="game-card" href="./index.html"><span aria-hidden="true">🍎</span><strong>數數小果園</strong><small>看水果練加減法</small></a>
      <a class="game-card" href="./zhuyin.html"><span aria-hidden="true">🚂</span><strong>注音小火車</strong><small>聽 37 個注音與拼讀</small></a>
      <a class="game-card" href="./english.html"><span aria-hidden="true">🧭</span><strong>英文單字探險</strong><small>100 個小一入門單字</small></a>
      <a class="game-card" href="./flags.html"><span aria-hidden="true">🌍</span><strong>國旗小旅行</strong><small>32 面國旗與雙語發音</small></a>
    </div>
  </section>
</main>
</body>
</html>
