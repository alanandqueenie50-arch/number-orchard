<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fff8ee">
<title>時間小島｜小小練習島</title>
<style>
:root{color-scheme:light;--ink:#35294e;--violet:#613c9f;--mint:#b5edd9;--orange:#a74425;--paper:#fff8ee}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 100% 0%,#eadbff,transparent 52%),var(--paper);color:var(--ink);font-family:ui-rounded,"PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.4}
main{width:min(100% - 24px,655px);margin:10px auto 28px}
a{color:inherit}.back{display:inline-block;padding:9px 0;text-decoration:none;font-weight:850}
h1,h2,p{margin:0}
.hero,.panel{border:2px solid var(--ink);border-radius:24px;box-shadow:4px 4px 0 var(--ink)}
.hero{display:flex;align-items:center;gap:13px;margin:3px 0 15px;padding:13px 17px;background:var(--mint)}
.hero-icon{display:grid;place-items:center;flex:none;width:51px;height:51px;border:2px solid var(--ink);border-radius:15px;background:#fff1a8;font-size:30px;transform:rotate(-7deg)}
h1{font-size:clamp(28px,7vw,40px);font-weight:950;line-height:1.15}
.hero p{font-size:14px;font-weight:750;margin-top:3px}
.panel{background:#fffdf8;padding:clamp(10px,3vw,20px)}
button,select{font:inherit;color:inherit;background:#fff;border:2px solid var(--ink);border-radius:13px;min-height:43px;min-width:44px;padding:5px 9px;font-weight:850}
button{cursor:pointer;touch-action:manipulation}button:active:not(:disabled){transform:translateY(2px)}
a:focus-visible,button:focus-visible,select:focus-visible,[tabindex="-1"]:focus-visible{outline:3px dashed var(--violet);outline-offset:3px}
.toolbar{display:flex;gap:7px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;flex:1}
.modes button{white-space:nowrap;background:#ede2ff}
.modes button:last-child{background:#ffe4b2}
.modes button[aria-pressed=true]{box-shadow:inset 0 0 0 2px white,0 3px 0 var(--ink)}
.modes button[aria-pressed=true]::before{content:"✓ "}
.status{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:850;margin:12px 0 5px}
#stars{background:#fff0ac;border-radius:99px;padding:3px 8px}
progress{display:block;width:100%;height:9px;accent-color:var(--violet)}
#play,#finished{text-align:center;margin-top:10px}
h2{font-size:clamp(20px,5vw,28px);font-weight:950}
#target{font-size:clamp(23px,7vw,37px);font-variant-numeric:tabular-nums;font-weight:950;color:var(--violet)}
.dial{
  position:relative;width:min(100%,315px);aspect-ratio:1;margin:10px auto 5px;
  border:9px solid #bca5ee;border-radius:50%;background:#fffcf1;
  box-shadow:0 4px 0 #794fb54e,inset 0 0 0 2px #8270a4;
  container-type:inline-size;isolation:isolate;user-select:none;
}
.dial.adjustable{touch-action:none;cursor:crosshair}
.tick,.number,.hand,.pin{position:absolute}
.tick{top:2.6%;left:calc(50% - 1px);width:2px;height:2%;border-radius:2px;background:#a39cb1;transform-origin:50% 2370%;transform:rotate(var(--angle))}
.tick.major{top:2.8%;height:3.6%;width:3px;left:calc(50% - 1.5px);background:var(--ink);transform-origin:50% 1311%}
.number{left:var(--x);top:var(--y);transform:translate(-50%,-50%);font-size:7.8cqw;font-weight:950;font-variant-numeric:tabular-nums}
.hand{z-index:2;left:50%;bottom:50%;transform:translateX(-50%) rotate(var(--turn));transform-origin:50% 100%;border-radius:999px 999px 3px 3px}
.hand::before{content:"";position:absolute;inset:0 -10px}
.hour{height:23%;width:13px;background:var(--violet);z-index:3}
.minute{height:34%;width:8px;background:var(--orange)}
.adjustable .hand{cursor:grab}
.pin{z-index:4;width:17px;aspect-ratio:1;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff3b7;border:3px solid var(--ink);border-radius:50%;pointer-events:none}
.legend{display:flex;gap:16px;justify-content:center;font-size:13px;font-weight:850;margin-top:8px}
.legend span::before{content:"";display:inline-block;width:13px;height:6px;vertical-align:middle;border-radius:5px;margin-right:5px;background:var(--violet)}
.legend span:last-child::before{background:var(--orange)}
.choices,.hands{display:grid;gap:7px;margin-top:9px}
.choices{grid-template-columns:repeat(3,minmax(0,1fr))}
.choices button{font-size:clamp(21px,6vw,34px);font-variant-numeric:tabular-nums;background:#fff0a8;min-height:55px;padding-inline:0}
.choices button:nth-child(2){background:#c9f1e1}
.choices button:nth-child(3){background:#e7dcff}
.choices .right{background:#b8efd1}.choices .wrong{background:#f4edf2;color:#74576a}
.hands{grid-template-columns:repeat(2,minmax(0,1fr))}
.hand-control{display:grid;grid-template-columns:44px 1fr 44px;gap:3px;padding:3px;border:1px solid #d7cce6;border-radius:14px}
.hand-control button{min-width:0;padding-inline:2px}
.hand-control [aria-pressed=true]{background:#ede1ff;border-color:var(--violet)}
.hand-control:last-child [aria-pressed=true]{background:#ffe6cf;border-color:var(--orange)}
#feedback{min-height:1.4em;margin-top:6px;font-weight:850}
#help{margin-top:5px;font-size:13px}
.primary{background:var(--violet);color:white;width:100%;margin-top:8px}
.medal{font-size:50px}#finished p{margin:7px 0}
[hidden]{display:none!important}
@media(max-width:380px){.toolbar select{width:100%}.hand-control{grid-template-columns:35px 1fr 35px}.hand-control button{font-size:13px}}
</style>
</head>
<body>
<main>
<a class="back" href="./learn.html">← 回小小練習島</a>
<header class="hero"><span class="hero-icon" aria-hidden="true">⌚</span><div><h1>時間小島</h1><p>看懂時針和分針，再自己撥撥看。</p></div></header>
<section class="panel" aria-label="時鐘練習">
  <div class="toolbar">
    <div class="modes" role="group" aria-label="選擇玩法">
      <button type="button" data-mode="read" aria-pressed="true">看鐘選時間</button>
      <button type="button" data-mode="set" aria-pressed="false">動手撥指針</button>
    </div>
    <select id="level" aria-label="練習難度">
      <option value="30">整點和半點</option><option value="5">每 5 分鐘</option><option value="1">每 1 分鐘</option>
    </select>
  </div>
  <div class="status"><span id="count"></span><span id="stars">⭐ 0 顆星</span></div>
  <progress id="progress" max="5" value="0" aria-label="闖關進度"></progress>
  <div id="play">
    <h2 id="prompt" tabindex="-1">鐘面上是幾點？</h2>
    <p id="target" hidden></p>
    <div id="dial" class="dial" role="img" aria-label="請看鐘面上的時針和分針">
      <span id="minute" class="hand minute" data-hand="minute" aria-hidden="true"></span>
      <span id="hour" class="hand hour" data-hand="hour" aria-hidden="true"></span>
      <span class="pin" aria-hidden="true"></span>
    </div>
    <p class="legend"><span>短針是時針</span><span>長針是分針</span></p>
    <div id="choices" class="choices" role="group" aria-label="選擇時間"></div>
    <div id="adjust" hidden>
      <p id="help">可拖動指針，或按兩邊的 −、＋。</p>
      <div class="hands">
        <div class="hand-control" role="group" aria-label="調整時針">
          <button type="button" data-adjust="hour" data-step="-1" aria-label="時針退一小時">−</button>
          <button type="button" data-select="hour" aria-pressed="true">時針</button>
          <button type="button" data-adjust="hour" data-step="1" aria-label="時針進一小時">＋</button>
        </div>
        <div class="hand-control" role="group" aria-label="調整分針">
          <button type="button" data-adjust="minute" data-step="-1" aria-label="分針往回撥">−</button>
          <button type="button" data-select="minute" aria-pressed="false">分針</button>
          <button type="button" data-adjust="minute" data-step="1" aria-label="分針往前撥">＋</button>
        </div>
      </div>
      <button type="button" class="primary" id="check">檢查</button>
    </div>
    <p id="feedback" role="status"></p>
  </div>
  <div id="finished" hidden><span class="medal" aria-hidden="true">🏅</span><h2 id="finish-title" tabindex="-1">時間任務完成！</h2>
    <p>你收集了 5 顆星。</p><button type="button" class="primary" id="restart">再玩一次</button>
  </div>
  <noscript>請開啟 JavaScript 開始玩。</noscript>
</section>
</main>
<script src="./clock-game.js" defer></script>
</body>
</html>
